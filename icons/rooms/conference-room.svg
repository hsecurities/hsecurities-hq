<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="#334155" stroke-width="1.5"/>
  <circle cx="54" cy="10" r="3" fill="#0066FF"/>
  
  <!-- Icon Graphics -->
  <g transform="translate(12, 12)">
    
    <!-- Boardroom table with executive members -->
    <ellipse cx="20" cy="20" rx="16" ry="9" stroke="url(#accentGrad)" stroke-width="2.5" fill="#0B1220"/>
    <circle cx="20" cy="7" r="3" fill="#38BDF8"/>
    <circle cx="20" cy="33" r="3" fill="#38BDF8"/>
    <circle cx="7" cy="20" r="3" fill="#38BDF8"/>
    <circle cx="33" cy="20" r="3" fill="#38BDF8"/>
    <rect x="14" y="18" width="12" height="4" rx="2" fill="#FFFFFF"/>
  
  </g>
</svg>