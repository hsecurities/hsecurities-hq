<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 340" fill="none">
  <defs>
    <linearGradient id="vShieldGrad" x1="160" y1="20" x2="160" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <filter id="vGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="320" height="340" rx="20" fill="#0B1220"/>
  <rect width="318" height="338" x="1" y="1" rx="19" stroke="#1E293B" stroke-width="1.5" fill="none"/>

  <!-- Shield and Globe centered -->
  <g transform="translate(110, 30)">
    <path d="M50 8 L88 24 V58 C88 84 50 102 50 102 C50 102 12 84 12 58 V24 Z" 
          stroke="url(#vShieldGrad)" stroke-width="3.5" fill="#0B1220" filter="url(#vGlow)"/>
    <path d="M50 16 L80 28 V56 C80 76 50 92 50 92 C50 92 20 76 20 56 V28 Z" 
          stroke="#0066FF" stroke-width="1.5" stroke-dasharray="4 2" fill="none" opacity="0.8"/>

    <ellipse cx="50" cy="52" rx="24" ry="24" stroke="#38BDF8" stroke-width="1.2" opacity="0.35"/>
    <ellipse cx="50" cy="52" rx="12" ry="24" stroke="#38BDF8" stroke-width="1.2" opacity="0.6"/>
    <path d="M26 52 H74 M31 40 H69 M31 64 H69" stroke="#38BDF8" stroke-width="1.2" opacity="0.45"/>

    <path d="M42 38 V66 M42 50 C42 44 58 44 58 50 V66" 
          stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#vGlow)"/>
    <circle cx="50" cy="33" r="3.5" fill="#38BDF8"/>
  </g>

  <!-- Typography Centered -->
  <text x="160" y="195" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="28" fill="#FFFFFF">
    <tspan fill="#38BDF8">h</tspan>SECURITIES <tspan fill="#0066FF">HQ</tspan>
  </text>

  <text x="160" y="222" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="10.5" letter-spacing="3" fill="#94A3B8">
    STRATEGY. SECURITY. SOLUTIONS.
  </text>

  <text x="160" y="250" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="500" font-size="12" fill="#38BDF8">
    CYBER TRAINING CAMPUS
  </text>

  <g transform="translate(100, 275)">
    <rect width="120" height="26" rx="13" fill="#1E293B" stroke="#0066FF" stroke-width="1"/>
    <circle cx="16" cy="13" r="4" fill="#38BDF8"/>
    <text x="28" y="17" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="10" fill="#FFFFFF" letter-spacing="1">ENTER CAMPUS</text>
  </g>
</svg>
