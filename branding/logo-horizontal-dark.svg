<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" fill="none">
  <defs>
    <linearGradient id="shieldGradDark" x1="20" y1="10" x2="100" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="coreGlow" x1="60" y1="30" x2="60" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container for Dark Mode -->
  <rect width="540" height="120" rx="16" fill="#0B1220"/>
  
  <!-- Subtle cyber grid lines -->
  <path d="M0 40 H540 M0 80 H540 M140 0 V120 M400 0 V120" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.5"/>

  <!-- SHIELD + GLOBE EMBLEM -->
  <g transform="translate(18, 10)">
    <!-- Outer Cyber Shield Frame -->
    <path d="M50 8 L86 22 V54 C86 78 50 94 50 94 C50 94 14 78 14 54 V22 Z" 
          stroke="url(#shieldGradDark)" stroke-width="3" fill="#0B1220" filter="url(#cyberGlow)"/>
    
    <!-- Shield Accent Rim -->
    <path d="M50 14 L80 26 V52 C80 72 50 86 50 86 C50 86 20 72 20 52 V26 Z" 
          stroke="#0066FF" stroke-width="1.5" stroke-dasharray="4 2" fill="none" opacity="0.8"/>

    <!-- Globe Grid Longitude & Latitude -->
    <ellipse cx="50" cy="48" rx="22" ry="22" stroke="#38BDF8" stroke-width="1.2" opacity="0.35"/>
    <ellipse cx="50" cy="48" rx="11" ry="22" stroke="#38BDF8" stroke-width="1.2" opacity="0.6"/>
    <path d="M28 48 H72 M33 37 H67 M33 59 H67" stroke="#38BDF8" stroke-width="1.2" opacity="0.45"/>

    <!-- Central 'h' Cyber Monogram + Keyhole Core -->
    <path d="M42 34 V62 M42 46 C42 40 58 40 58 46 V62" 
          stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#cyberGlow)"/>
    <circle cx="50" cy="30" r="3" fill="#38BDF8"/>
  </g>

  <!-- TYPOGRAPHY: hSECURITIES HQ -->
  <g transform="translate(132, 28)">
    <!-- Brand Title -->
    <text x="0" y="38" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="34" letter-spacing="-0.5" fill="#FFFFFF">
      <tspan fill="#38BDF8">h</tspan>SECURITIES <tspan fill="#0066FF">HQ</tspan>
    </text>

    <!-- Tagline -->
    <text x="2" y="62" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="11.5" letter-spacing="3.5" fill="#94A3B8">
      STRATEGY. SECURITY. SOLUTIONS.
    </text>
  </g>

  <!-- Security Status Chip -->
  <g transform="translate(450, 48)">
    <rect width="68" height="24" rx="12" fill="#1E293B" stroke="#0066FF" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#38BDF8"/>
    <text x="22" y="15.5" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="9" fill="#FFFFFF" letter-spacing="0.5">SECURE</text>
  </g>
</svg>
